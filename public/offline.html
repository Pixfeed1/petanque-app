<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hors ligne · Pétanque Pro</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #e8f3da; color: #1a3322; padding: 24px; text-align: center;
    }
    .card { max-width: 380px; }
    img { width: 96px; height: 96px; margin-bottom: 20px; }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    p { margin: 0 0 20px; color: #2d5530; line-height: 1.5; }
    button {
      background: #1a3322; color: #fff; border: 0; border-radius: 10px;
      padding: 12px 22px; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="Pétanque Pro" />
    <h1>Vous êtes hors ligne</h1>
    <p>Pétanque Pro a besoin d'une connexion pour charger vos tournois. Vérifiez votre réseau puis réessayez.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
